<!DOCTYPE html>
<html lang="zh-CN">
{{ partial "head.html" . }}
<body>
{{ partial "header.html" . }}
<main class="main">
  <article class="post-single">
    <header class="post-header">
      <h1 class="post-title">{{ .Title }}</h1>
      <div class="post-meta">
        {{ if .Params.description }}<p style="color:#888;font-size:14px;">{{ .Params.description }}</p>{{ end }}
      </div>
    </header>
    <div class="post-content">
      {{ .Content }}
    </div>
  </article>
</main>
{{ partial "footer.html" . }}
</body>
</html>
